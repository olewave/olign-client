// 句子评测的请求详细 response.params.request
//
// Next ID: 15
message SentenceRequestInfo {
  // Type of the assessment
  string core_type = 1;

  // 用户请求唯一标识
  string token_id = 2;

  // 评分参考文本
  string ref_text = 3;

  // 评分分制, 4 or 100
  int32 rank = 4;

  // 评测结果中是否返回音频url (0 or 1)
  int32 attach_audio_url = 5;

  // US accent by default (value = 2)
  int32 accent = 6;

  int32 ipa = 7;

  // time stamp
  string timestamp = 8;

  // timeout
  int32 core_timeout = 9;

  // sig
  string sig = 10;

  // user_id
  string user_id = 11;

  // 评分精度 (设为1）
  float precision = 12;

  // 句子评测，详细得分选项
  ParamsForWordSentenceModes result = 13;

  // 浊化开关，可填0或1，默认是1。
  // 值为0，表示用户发音浊化和非浊化都算正确。
  // 值为1，表示用户发音必须浊化才算正确。
  int32 voiced = 14;
}


