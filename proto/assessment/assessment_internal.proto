syntax = "proto3";

import "common_types.proto";

package olewave.olign;

// IPA符号
//
// Next ID: 4
message IPASymbol {
  // Haoxue (??)
  string haoxue_ipa = 1;

  // IPA63 (UK)
  string uk_ipa63 = 2;

  // IPA88 (UK)
  string uk_ipa88 = 3;

  // K.K. (US)
  string us_kk = 4;
}

// Stores messages related to the internal data (data structure)

// 单词，句子评测中的字母簇中的某一个音素对应的信息
// 
// Next ID: 6
message PhoneToLetter {
  // IPA phone
  string ipa = 2;

  // phone group the IPA phones in one segment
  repeated string phone_group = 3;

  // 字母簇 letters correspond to this phone
  // note one phone can correspond to one or multiple letters
  string letters = 4;

  // the ordinal of phone in phones that this phone is in
  // note that one letter can correspond to one or multiple phones
  // It can be one `char` corresponds to multiple letters, e.g.: 
  // phone 'ay' correspond to 'i' in bike, the items are ('i', ['ay'], 1).
  // It can alse be multiple `char`s correspond to one letter,
  // e.g.: the first phone 'b' in word 'bbq', the items are:
  // ('b_B', 'b', ['b', 'iy'], 'b', 1)
  // ('iy_I', 'iy', ['b', 'iy'], 'b', 2)
  int32 phone_ordinal = 5;
}

// A pronunciation of the word
// 
// the size of the phone_ids and phone_to_letters are the same 
// 
// Next ID: 4
message PronunciationItem {
  // phone ids
  repeated int32 phone_ids = 1;

  // phone to letter groups
  repeated PhoneToLetter phone_to_letters = 2;
}

// Lexicon table
// 
// Next ID: 4
message LexiconItem {
  // word
  int32 word_id = 1;

  // hold US single/multiple pronunciations
  repeated PronunciationItem us_pronunciations = 2;

  // hold UK single/multiple pronunciations
  repeated PronunciationItem uk_pronunciations = 3;
}

// The scores of phone
// can be 0-100, or 0-4 
//
// Next ID: 4
message PhoneScore {
  // Overall score
  float overall = 1;

  // Reading accuracy/pronunciation score for phone, syllable, word, sentence, paragraph
  // Note: maybe accuracy and pronuciaiton scores are different?
  float pronunciation = 2;

  // Log posterior probability
  float log_posterior = 3;
}

// The scores of word
// can be 0-100, or 0-4 
//
// Next ID: 5
message WordScore {
  // Overall score
  float overall = 1;

  // Reading accuracy/pronunciation score for phone, syllable, word, sentence, paragraph
  // Note: maybe accuracy and pronuciaiton scores are different?
  float pronunciation = 2;

  float log_posterior = 3;

  // Reserved for speed recognition
  float confidence = 4;
}

// Phone info
//
// Next ID: 5
message PhoneInfo {
  // Phone string
  string phone = 1;

  // The beginning of the phone in milliseconds.
  int32 from_msec = 2;

  // The end of the phone in milliseconds.
  int32 to_msec = 3;

  // phone type
  int32 phone_type = 4;
}

// Word-level inferenced result
// TODO: modify this according to Chivox output format
//
// Next ID: 10
message WordInfo {
  // For assessment, it is reference word;
  // in INSERTED case, it is empty.
  // For recognition, it is empty.
  string ref_word = 1;

  // For assessment, it is hypothesized word;
  // in SKIPPED case, it is empty
  // in MISPRONOUNCED case, `hyp_word` could still be the same as `ref_word`.
  // in pronounced not well case, `hyp_word` is the same as `ref_word`.
  // For recognition, it is hypothesized word;
  string hyp_word = 2;

  // Information of phones in the word.
  // For assessment, for SKIPPED word, it is empty;
  // it stores the reference and hypothesis syllables
  // For recognition, it is empty.
  repeated PhoneInfo phones = 6;

  // Word duration: the begin and end of the word in milliseconds.
  int32 from_msec = 7;
  int32 to_msec = 8;
  
  // Word score
  WordScore score = 9;
}

// Mapping between original word and reference normalized word
//
// Next ID: 3
message WordPair {
  // Reference word
  string orig_word = 1; // "Self-motivated"

  // Group of reference (not hypothesized) normalized words after processing
  repeated string ref_norm_words = 2;  // {"self, "motivated"}
}


// Start index and end index of a word in the text (as a character array).
//
// Next ID: 3
message WordBoundaryIndices {
  // start char index 
  int32 begin_index = 1; 

  // end char index
  int32 end_index = 2;
}

// The scores of sentence, or paragraph
// can be 0-100, or 0-4 
//
// Next ID: 8
message SegmentScore {
  // Overall score
  float overall = 1;

  // Reading accuracy/pronunciation score for phone, syllable, word, sentence, paragraph
  // Note: maybe accuracy and pronuciaiton scores are different?
  float accuracy = 2;

  // How fluent the read sentence or graph is. Currently calculate as the 
  // number of filler words (um, uh) over the number of words in `ref_transcript`.
  float fluency = 3;

  // How integral the read sentence or paragraph is. Currently calculated 
  // by first running alignment of `ref_transcript` and `hyp_transcript`, 
  // then calculate as the number of common words in the alignment over 
  // the number of words in `ref_transcript`.
  float integrity = 4;

  // Reserved for paragraph assessment. The accuracy score for each segment of 
  // a paragraph.
  repeated float sentence_scores = 5;

  // 语速，即每分钟读的单词数（比例值）(for sentence assessment)
  int32 speed = 6;

  // 停顿次数，间隔大于0.5秒算一次 (for sentence assessment)
  int32 pause = 7; 
}

